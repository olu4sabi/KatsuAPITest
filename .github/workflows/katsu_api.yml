on:
  push: {}
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 7:00 AM UTC (8:00 AM WAT)

jobs:
  katsu-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run Katsu Wallet API tests
        run: |
          postman collection run "46224899-5d486da3-711e-4a2c-af97-b3ecaa0b23b8" \
            -e "34441668-61ac56f0-4118-4b84-9cf1-c99e6e61816f" \
            > postman_output.txt || true

      - name: Extract Postman run summary URL
        id: extract_url
        run: |
          SUMMARY_URL=$(grep -o 'https://go.postman.co/workspace[^ ]*' postman_output.txt | head -n 1)
          if [ -z "$SUMMARY_URL" ]; then
            SUMMARY_URL="(Summary URL not found)"
          fi
          echo "SUMMARY_URL=$SUMMARY_URL" >> $GITHUB_ENV

      - name: Determine Test Result
        id: check_status
        run: |
          if [ "${{ steps.run_postman.outcome }}" = "success" ]; then
            echo "RESULT_MSG=:white_check_mark: Katsu Wallet API Tests Passed!" >> $GITHUB_ENV
            echo "RESULT_STATUS=success" >> $GITHUB_ENV
          else
            echo "RESULT_MSG=:x: Katsu Wallet API Tests Failed!" >> $GITHUB_ENV
            echo "RESULT_STATUS=failure" >> $GITHUB_ENV
          fi

      - name: Send results to Slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ env.RESULT_MSG }}\nView Test Summary on Postman: ${{ env.SUMMARY_URL }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Fail workflow if tests failed
        if: env.RESULT_STATUS == 'failure'
        run: exit 1
