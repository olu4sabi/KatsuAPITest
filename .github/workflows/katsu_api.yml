name: Katsu API Tests

on: 
  push:
  schedule:
    - cron: '0 7 * * *' # Daily 7:00 UTC (8:00 WAT)

jobs:
  katsu-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run Katsu Wallet API tests
        run: |
          postman collection run "46224899-5d486da3-711e-4a2c-af97-b3ecaa0b23b8" \
            -e "34441668-61ac56f0-4118-4b84-9cf1-c99e6e61816f" \
            --reporters cli > postman_output.txt || true

      - name: Parse results into Markdown
        id: parse
        run: |
          # Strip ANSI colors
          sed 's/\x1b\[[0-9;]*m//g' postman_output.txt > clean_output.txt

          # Extract numbers for each metric
          ITER=$(grep "iterations" clean_output.txt | awk '{print $(NF-1)}')
          ITER_FAIL=$(grep "iterations" clean_output.txt | awk '{print $NF}')
          REQ=$(grep "requests" clean_output.txt | awk '{print $(NF-1)}')
          REQ_FAIL=$(grep "requests" clean_output.txt | awk '{print $NF}')
          TS=$(grep "test-scripts" clean_output.txt | awk '{print $(NF-1)}')
          TS_FAIL=$(grep "test-scripts" clean_output.txt | awk '{print $NF}')
          PRE=$(grep "prerequest-scripts" clean_output.txt | awk '{print $(NF-1)}')
          PRE_FAIL=$(grep "prerequest-scripts" clean_output.txt | awk '{print $NF}')
          ASSERT=$(grep "assertions" clean_output.txt | awk '{print $(NF-1)}')
          ASSERT_FAIL=$(grep "assertions" clean_output.txt | awk '{print $NF}')

          # Duration & response time
          DURATION=$(grep "total run duration" clean_output.txt | sed 's/.*duration: //')
          RESP_TIME=$(grep "average response time" clean_output.txt | sed 's/.*time: //')

          # Build markdown table
          echo "| Metric             | Executed | Failed |" > summary.md
          echo "|--------------------|----------|--------|" >> summary.md
          echo "| Iterations         | $ITER     | $ITER_FAIL |" >> summary.md
          echo "| Requests           | $REQ     | $REQ_FAIL |" >> summary.md
          echo "| Test Scripts       | $TS     | $TS_FAIL |" >> summary.md
          echo "| Pre-req Scripts    | $PRE     | $PRE_FAIL |" >> summary.md
          echo "| Assertions         | $ASSERT     | $ASSERT_FAIL |" >> summary.md
          echo "" >> summary.md
          echo "*Duration:* $DURATION" >> summary.md
          echo "*Avg Response Time:* $RESP_TIME" >> summary.md

          # Decide pass/fail
          TOTAL_FAIL=$((ITER_FAIL + REQ_FAIL + TS_FAIL + PRE_FAIL + ASSERT_FAIL))
          STATUS="✅ PASSED"
          if [ "$TOTAL_FAIL" -gt 0 ]; then
            STATUS="🚨 FAILED"
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          cat summary.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Slack
        run: |
          STATUS="${{ steps.parse.outputs.status }}"
          SUMMARY="${{ steps.parse.outputs.summary }}"

          # Escape Markdown text safely
          SUMMARY_ESCAPED=$(echo "$SUMMARY" | jq -Rs .)

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\": \"Katsu Wallet API Test Results\",
            \"blocks\": [
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \":bell: *Katsu Wallet API Test Results*\\n${STATUS}\\n\`\`\`$(echo $SUMMARY_ESCAPED | sed 's/^\"//;s/\"$//')\`\`\`\"
                }
              }
            ]
          }" ${{ secrets.SLACK_WEBHOOK_URL }}
